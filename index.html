<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>主题包下载</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --line:#e5e7eb; --ink:#111827;
    --muted:#6b7280; --accent:#1f2937; --accent-ink:#ffffff; --hover:#f3f4f6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
         "Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px 72px}

  header{padding:52px 0 28px}
  h1{margin:0 0 10px;font-size:28px;letter-spacing:-.02em;font-weight:650}
  header p{margin:0;color:var(--muted);font-size:14.5px;max-width:660px}

  .tabs{
    display:flex;gap:8px;flex-wrap:wrap;padding:14px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    position:sticky;top:12px;z-index:20;
    box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.12);
  }
  .tab{
    flex:1 1 0;min-width:96px;display:flex;flex-direction:column;gap:2px;
    align-items:center;justify-content:center;
    padding:11px 10px;border-radius:10px;border:1px solid transparent;
    background:transparent;cursor:pointer;color:var(--muted);
    font:inherit;transition:.15s;
  }
  .tab b{font-size:16px;font-weight:650;letter-spacing:.02em;color:var(--ink)}
  .tab small{font-size:11.5px;color:var(--muted)}
  .tab:hover{background:var(--hover)}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent)}
  .tab[aria-selected="true"] b,.tab[aria-selected="true"] small{color:var(--accent-ink)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 0}
  .dates,.states{display:flex;gap:8px;flex-wrap:wrap}
  .states{margin-left:auto}
  .date{
    display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:99px;
    border:1px solid var(--line);background:var(--card);color:var(--muted);
    font:inherit;font-size:13px;cursor:pointer;transition:.15s;
  }
  .date:hover{background:var(--hover)}
  .date b{font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums}
  .date i{font-style:normal;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .date[aria-selected="true"]{background:var(--accent);border-color:var(--accent)}
  .date[aria-selected="true"] b,.date[aria-selected="true"] i{color:var(--accent-ink)}
  .date.today:not([aria-selected="true"]){border-color:#111827;box-shadow:0 0 0 3px rgba(17,24,39,.06)}
  .date.today:not([aria-selected="true"]) i{color:#111827;font-weight:600}
  .states .date[aria-selected="true"]{background:#047857;border-color:#047857}
  .states .date[data-s="used"][aria-selected="true"]{background:#111827;border-color:#111827}

  .bar{display:flex;align-items:center;gap:14px;margin:26px 0 16px;flex-wrap:wrap}
  .bar h2{margin:0;font-size:15px;font-weight:650}
  .bar .range{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .bar .spacer{flex:1}
  input[type=search]{
    width:190px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);
    background:var(--card);font:inherit;font-size:13.5px;color:var(--ink);outline:none;
  }
  input[type=search]:focus{border-color:#9ca3af;box-shadow:0 0 0 3px rgba(156,163,175,.18)}
  .copy{
    padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:var(--card);
    font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer;transition:.15s;
  }
  .copy:hover{background:var(--hover)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:14px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px;
    transition:.15s;
  }
  .card:hover{border-color:#d1d5db;box-shadow:0 2px 4px rgba(16,24,40,.04),0 12px 28px -18px rgba(16,24,40,.25)}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .num-wrap{display:flex;align-items:center;gap:7px;min-width:0}
  .num{font-size:19px;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .bd{font-size:10.5px;line-height:1.5;padding:1px 6px;border-radius:5px;white-space:nowrap;
      background:var(--bg);border:1px solid var(--line);color:var(--muted);
      font-variant-numeric:tabular-nums}
  .bd.new{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .bd.used{background:#ecfdf5;border-color:#a7f3d0;color:#047857;font-weight:600;cursor:pointer}
  .chip.used-chip{background:#ecfdf5;border-color:#a7f3d0;color:#047857;font-weight:600;cursor:pointer}
  .card.used{background:#fafafa}
  .card.used .num{color:#9ca3af}
  .card.used .sw{opacity:.5}
  .card.used .dl{background:#6b7280}
  .card.used .dl:hover{background:#4b5563}
  .sz{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;
      white-space:nowrap;flex:0 0 auto}
  .sw{display:flex;height:8px;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .sw i{flex:1}
  .meta{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px;margin:0}
  .meta dt{color:var(--muted)}
  .meta dd{margin:0;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{font-size:11px;color:var(--muted);background:var(--bg);border:1px solid var(--line);
        padding:2px 7px;border-radius:99px;white-space:nowrap}
  .dl{
    margin-top:auto;display:block;text-align:center;text-decoration:none;
    padding:9px;border-radius:9px;background:var(--accent);color:var(--accent-ink);
    font-size:13.5px;font-weight:600;transition:.15s;
  }
  .dl:hover{background:#0b1220}
  .empty{grid-column:1/-1;padding:60px 0;text-align:center;color:var(--muted);font-size:14px}
  footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);
         color:var(--muted);font-size:12.5px}
  footer p{margin:0 0 8px}
  footer .tip{color:#9ca3af}
  footer .tip b{color:#047857;font-weight:600}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .tools .copy{font-size:12.5px;padding:6px 11px}
  footer code{background:var(--card);border:1px solid var(--line);border-radius:5px;
              padding:1px 5px;font-size:12px}
  @media (max-width:600px){
    .wrap{padding:0 14px 56px}
    header{padding:30px 0 18px}
    h1{font-size:22px}
    header p{font-size:13.5px}
    .tabs{top:8px;padding:8px;gap:6px;display:grid;grid-template-columns:repeat(2,1fr)}
    .tab{min-width:0;padding:9px 8px;overflow:hidden}
    .tab b{font-size:14px}
    .tab small{font-size:10.5px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;max-width:100%}
    .bar{gap:10px;margin:18px 0 12px}
    .states{margin-left:0;width:100%}
    .states .date{flex:1 1 0;justify-content:center;padding:7px 8px}
    .bar h2{font-size:14px}
    .bar .range{font-size:11.5px;flex:1 1 100%;order:3;margin-top:-4px}
    .bar .spacer{display:none}
    input[type=search]{width:auto;flex:1 1 120px}
    .copy{flex:0 0 auto}
    .grid{grid-template-columns:1fr;gap:12px}
    .num{font-size:18px}
  }
</style>
</head>

<div class="wrap">

  <header>
    <h1>主题包下载</h1>
    <p>共 500 个主题包，按标签分成 4 组，每人 125 个。分三批上传：<b>10-27</b>（100 个）、<b>10-30</b>（200 个）、<b>11-05</b>（200 个，今天新增）。可以按日期筛选，新批次在卡片上有黑色日期标签；下载过的会自动标成 <b>✓ 已使用</b>，记录存在本机浏览器。</p>

  <div class="tabs" role="tablist" id="tabs"></div>

  </div>

  <div class="grid" id="grid"></div>

  <footer>
    <p>下载后到 Shopify 后台 → 在线商店 → 主题 → 添加主题 → 上传 zip 文件。
    每个包都已包含完整的 427 个文件，根目录为 <code>layout/theme.liquid</code>，可直接上传。</p>
    <p class="tip">「已使用」记录保存在当前浏览器里，换设备或清缓存会丢失，可以用下面的按钮导出备份。
      点卡片上的 <b>✓ 已使用</b> 可以取消标记。</p>
    <div class="tools">
      <button class="copy" id="exportBtn">导出使用记录</button>
      <button class="copy" id="importBtn">导入记录</button>
      <button class="copy" id="resetBtn">清空记录</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </footer>
</div>

const GROUPS = [{"key":"cqz","label":"cqz","ranges":[[31,55],[131,180],[331,380]]},{"key":"hyl","label":"hyl","ranges":[[56,80],[181,230],[381,430]]},{"key":"lh","label":"lh","ranges":[[81,105],[231,280],[431,480]]},{"key":"mcy","label":"mcy","ranges":[[106,130],[281,330],[481,530]]}];

let active = GROUPS[0].key;

const BATCHES = [
  {key:'all',  label:'全部',   note:'',         cls:''},
  {key:'1105', label:'11-05',  note:'今天新增', cls:'today'},
  {key:'1030', label:'10-30',  note:'',         cls:''},
  {key:'1027', label:'10-27',  note:'',         cls:''}
];
function batchKey(n){ return n>=331 ? '1105' : (n>=131 ? '1030' : '1027'); }
function batchLabel(n){ return n>=331 ? '11-05' : (n>=131 ? '10-30' : '10-27'); }
let activeDate = 'all';

function datesHtml(){
  const cnt = k => k==='all' ? DATA.length : DATA.filter(r=>batchKey(r.n)===k).length;
  return BATCHES.map(b=>`<button class="date ${b.cls}" role="tab" data-d="${b.key}"
      aria-selected="${activeDate===b.key}">
      <b>${b.label}</b><i>${b.note ? b.note+' · ' : ''}${cnt(b.key)} 个</i></button>`).join('');
}

function rangeText(g){
  const rows = DATA.filter(r=>r.g===g.key);
  if(!rows.length) return '';
  return g.ranges.map(r=>`${r[0]}–${r[1]}`).join('、');
}

function tabHtml(){
  return GROUPS.map(g=>{
    const rows = DATA.filter(r=>r.g===g.key);
    return `<button class="tab" role="tab" data-g="${g.key}"
      aria-selected="${g.key===active}">
      <b>${g.label}</b><small>${rows.length} 个 · ${rangeText(g)}</small></button>`;
  }).join('');
}

const DL = 'https://cdn.jsdelivr.net/gh/ikun981228/theme-co@assets/themes/';
function dlUrl(n){ return DL + 'theme' + n + '.zip'; }

/* ---------- 使用状态（存本机 localStorage） ---------- */
const USED_KEY = 'theme-co-used-v1';
let used = {};
try { used = JSON.parse(localStorage.getItem(USED_KEY) || '{}') || {}; } catch(e){ used = {}; }
function saveUsed(){ try { localStorage.setItem(USED_KEY, JSON.stringify(used)); } catch(e){} }
function isUsed(n){ return !!used[n]; }
function markUsed(n){ if(!used[n]){ used[n] = today(); saveUsed(); } }
function unmarkUsed(n){ if(used[n]){ delete used[n]; saveUsed(); } }
function today(){
  const d = new Date();
  const p = x => String(x).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}

const STATES = [
  {key:'all',    label:'全部'},
  {key:'unused', label:'未使用'},
  {key:'used',   label:'已使用'}
];
let activeState = 'all';

function stateRows(){
  return DATA.filter(r=>r.g===active && (activeDate==='all' || batchKey(r.n)===activeDate));
}
function statesHtml(){
  const base = stateRows();
  const nUsed = base.filter(r=>isUsed(r.n)).length;
  const cnt = k => k==='all' ? base.length : (k==='used' ? nUsed : base.length - nUsed);
  return STATES.map(s=>`<button class="date" role="tab" data-s="${s.key}"
      aria-selected="${activeState===s.key}">
      <b>${s.label}</b><i>${cnt(s.key)} 个</i></button>`).join('');
}

function cardHtml(r){
  const u = isUsed(r.n);
  const chips = (u ? `<span class="chip used-chip" data-unuse="${r.n}" title="点击取消「已使用」标记">✓ 已使用</span>` : '')
    + r.layout.slice(0,4).map(t=>`<span class="chip">${t}</span>`).join('')
    + (r.layout.length>4?`<span class="chip">+${r.layout.length-4}</span>`:'');
  return `<article class="card${u?' used':''}" data-n="${r.n}">
    <div class="card-top">
      <span class="num-wrap"><span class="num">theme${r.n}</span><span class="bd ${batchKey(r.n)==='1105'?'new':''}">${batchLabel(r.n)}</span></span>
      <span class="sz">${r.mb} MB</span>
    </div>
    <div class="sw" title="${r.a1} / ${r.a2} / ${r.bg2} / ${r.text}">
      <i style="background:${r.a1}"></i><i style="background:${r.a2}"></i>
      <i style="background:${r.bg2}"></i><i style="background:${r.text}"></i>
    </div>
    <dl class="meta">
      <dt>配色</dt><dd title="${r.pal}">${r.palCn}</dd>
      <dt>字体</dt><dd>${r.font}</dd>
      <dt>页宽</dt><dd>${r.pw}px</dd>
      <dt>圆角</dt><dd>${r.radius}px</dd>
    </dl>
    <div class="chips">${chips}</div>
    <a class="dl" href="${dlUrl(r.n)}" download data-dl="${r.n}">${u?'重新下载':'下载'} theme${r.n}.zip</a>
  </article>`;
}

function currentRows(){
  return stateRows()
    .filter(r=> activeState==='all' || (activeState==='used' ? isUsed(r.n) : !isUsed(r.n)))
    .sort((a,b)=>a.n-b.n);   // 按编号正序
}

function render(){
  document.getElementById('tabs').innerHTML = tabHtml();
  document.querySelectorAll('#tabs .tab').forEach(el=>{
    el.onclick = ()=>{ active = el.dataset.g; render(); };
  });
  document.getElementById('dates').innerHTML = datesHtml();
  document.querySelectorAll('#dates .date').forEach(el=>{
    el.onclick = ()=>{ activeDate = el.dataset.d; render(); };
  });
  document.getElementById('states').innerHTML = statesHtml();
  document.querySelectorAll('#states .date').forEach(el=>{
    el.onclick = ()=>{ activeState = el.dataset.s; render(); };
  });

  const rows = currentRows();
  const q = document.getElementById('q').value.trim();
  const shown = q ? rows.filter(r=>String(r.n).includes(q)) : rows;
  const b = BATCHES.find(x=>x.key===activeDate);
  document.getElementById('groupName').textContent =
    active + (activeDate==='all' ? '' : ' · ' + b.label + (b.note ? ' ' + b.note : ''));
  const totalMb = rows.reduce((s,r)=>s+r.mb, 0).toFixed(1);
  const g = GROUPS.find(x=>x.key===active);
  const usedHere = rows.filter(r=>isUsed(r.n)).length;
  document.getElementById('groupRange').textContent =
    rows.length ? `${rangeText(g)} · 共 ${rows.length} 个 · ${totalMb} MB · 已使用 ${usedHere}` : '';
  document.getElementById('grid').innerHTML =
    shown.length ? shown.map(cardHtml).join('')
                 : '<div class="empty">没有匹配的主题</div>';
}

// 点下载 → 自动标记已使用；点「✓ 已使用」→ 取消标记
document.getElementById('grid').addEventListener('click', e=>{
  const dl = e.target.closest('.dl');
  if(dl){
    markUsed(Number(dl.dataset.dl));
    setTimeout(render, 60);   // 让浏览器先发起下载，再刷新卡片状态
    return;
  }
  const un = e.target.closest('[data-unuse]');
  if(un){
    unmarkUsed(Number(un.dataset.unuse));
    render();
  }
});

document.getElementById('q').addEventListener('input', render);
document.getElementById('copy').onclick = async ()=>{
  const rows = currentRows();
  const text = rows.map(r=>`theme${r.n}\t${dlUrl(r.n)}`).join('\n');
  try{
    await navigator.clipboard.writeText(text);
    const btn = document.getElementById('copy');
    btn.textContent = '已复制 ' + rows.length + ' 条';
    setTimeout(()=>btn.textContent='复制本组链接', 1800);
  }catch(e){ alert('复制失败，请手动选择'); }
};

/* ---------- 导出 / 导入 / 清空 ---------- */
document.getElementById('exportBtn').onclick = ()=>{
  const payload = {version:1, exportedAt:today(), used};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'theme-used-' + today() + '.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
};

document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();

document.getElementById('importFile').onchange = e=>{
  const f = e.target.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const o = JSON.parse(rd.result);
      const src = o && o.used ? o.used : o;
      if(!src || typeof src !== 'object') throw new Error('格式不对');
      Object.keys(src).forEach(k=>{
        const n = Number(k);
        if(Number.isFinite(n)) used[n] = typeof src[k] === 'string' ? src[k] : today();
      });
      saveUsed(); render();
      alert('已导入 ' + Object.keys(src).length + ' 条使用记录');
    }catch(err){ alert('导入失败：' + err.message); }
    e.target.value = '';
  };
  rd.readAsText(f);
};

document.getElementById('resetBtn').onclick = ()=>{
  if(!confirm('确定清空所有「已使用」标记？此操作不可撤销。')) return;
  used = {}; saveUsed(); render();
};

render();
</script>
</body>
</html>
