<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>主题包下载</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --line:#e5e7eb; --ink:#111827;
    --muted:#6b7280; --accent:#1f2937; --accent-ink:#ffffff; --hover:#f3f4f6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
         "Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px 72px}

  header{padding:52px 0 28px}
  h1{margin:0 0 10px;font-size:28px;letter-spacing:-.02em;font-weight:650}
  header p{margin:0;color:var(--muted);font-size:14.5px;max-width:640px}

  .tabs{
    display:flex;gap:8px;flex-wrap:wrap;padding:14px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    position:sticky;top:12px;z-index:20;
    box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.12);
  }
  .tab{
    flex:1 1 0;min-width:96px;display:flex;flex-direction:column;gap:2px;
    align-items:center;justify-content:center;
    padding:11px 10px;border-radius:10px;border:1px solid transparent;
    background:transparent;cursor:pointer;color:var(--muted);
    font:inherit;transition:.15s;
  }
  .tab b{font-size:16px;font-weight:650;letter-spacing:.02em;color:var(--ink)}
  .tab small{font-size:11.5px;color:var(--muted)}
  .tab:hover{background:var(--hover)}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent)}
  .tab[aria-selected="true"] b,.tab[aria-selected="true"] small{color:var(--accent-ink)}

  .bar{display:flex;align-items:center;gap:14px;margin:26px 0 16px;flex-wrap:wrap}
  .bar h2{margin:0;font-size:15px;font-weight:650}
  .bar .range{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .bar .spacer{flex:1}
  input[type=search]{
    width:190px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);
    background:var(--card);font:inherit;font-size:13.5px;color:var(--ink);outline:none;
  }
  input[type=search]:focus{border-color:#9ca3af;box-shadow:0 0 0 3px rgba(156,163,175,.18)}
  .copy{
    padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:var(--card);
    font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer;transition:.15s;
  }
  .copy:hover{background:var(--hover)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:14px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px;
    transition:.15s;
  }
  .card:hover{border-color:#d1d5db;box-shadow:0 2px 4px rgba(16,24,40,.04),0 12px 28px -18px rgba(16,24,40,.25)}
  .card-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .num{font-size:19px;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .sz{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .sw{display:flex;height:8px;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .sw i{flex:1}
  .meta{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px;margin:0}
  .meta dt{color:var(--muted)}
  .meta dd{margin:0;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{font-size:11px;color:var(--muted);background:var(--bg);border:1px solid var(--line);
        padding:2px 7px;border-radius:99px;white-space:nowrap}
  .dl{
    margin-top:auto;display:block;text-align:center;text-decoration:none;
    padding:9px;border-radius:9px;background:var(--accent);color:var(--accent-ink);
    font-size:13.5px;font-weight:600;transition:.15s;
  }
  .dl:hover{background:#0b1220}
  .empty{grid-column:1/-1;padding:60px 0;text-align:center;color:var(--muted);font-size:14px}
  footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);
         color:var(--muted);font-size:12.5px}
  footer code{background:var(--card);border:1px solid var(--line);border-radius:5px;
              padding:1px 5px;font-size:12px}
  @media (max-width:600px){
    .wrap{padding:0 14px 56px}
    header{padding:30px 0 18px}
    h1{font-size:22px}
    header p{font-size:13.5px}
    .tabs{top:8px;padding:8px;gap:6px;display:grid;grid-template-columns:repeat(2,1fr)}
    .tab{min-width:0;padding:9px 8px;overflow:hidden}
    .tab b{font-size:14px}
    .tab small{font-size:10.5px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;max-width:100%}
    .bar{gap:10px;margin:18px 0 12px}
    .bar h2{font-size:14px}
    .bar .range{font-size:11.5px;flex:1 1 100%;order:3;margin-top:-4px}
    .bar .spacer{display:none}
    input[type=search]{width:auto;flex:1 1 120px}
    .copy{flex:0 0 auto}
    .grid{grid-template-columns:1fr;gap:12px}
    .num{font-size:18px}
  }
</style>
</head>

","depth":4,"a1":"#5B4D34","a2":"#A08455","bg2":"#F7F5F2","text":"#262421","font":"rubik","pw":1300,"radius":24,"spacing":48,"sections":8,"layout":["轮播","对比表","多行图文","分栏内容","选项卡","常见问题","联系表单","订阅"],"mb":3.09,"g":"mcy","palCn":"沙褐"},{"n":130,"src":8,"pal":"cocoa","depth":4,"a1":"#5F4430","a2":"#A7744E","bg2":"#F8F4F2","text":"#272320","font":"source sans pro","pw":1350,"radius":0,"spacing":16,"sections":8,"layout":["轮播","图文左右","分栏内容","选项卡","内容块","常见问题","订阅","联系表单"],"mb":2.59,"g":"mcy","palCn":"可可"}];
const GROUPS = [{"key":"cqz","label":"cqz"},{"key":"hyl","label":"hyl"},{"key":"lh","label":"lh"},{"key":"mcy","label":"mcy"}];
const PER = 25;

let active = GROUPS[0].key;

function tabHtml(){
  return GROUPS.map(g=>{
    const rows = DATA.filter(r=>r.g===g.key);
    const lo = rows.length? rows[0].n : 0, hi = rows.length? rows[rows.length-1].n : 0;
    return `<button class="tab" role="tab" data-g="${g.key}"
      aria-selected="${g.key===active}">
      <b>${g.label}</b><small>${rows.length} 个 · ${lo}–${hi}</small></button>`;
  }).join('');
}

function cardHtml(r){
  const chips = r.layout.slice(0,4).map(t=>`<span class="chip">${t}</span>`).join('')
    + (r.layout.length>4?`<span class="chip">+${r.layout.length-4}</span>`:'');
  return `<article class="card">
    <div class="card-top">
      <span class="num">theme${r.n}</span>
      <span class="sz">${r.mb} MB</span>
    </div>
    <div class="sw" title="${r.a1} / ${r.a2} / ${r.bg2} / ${r.text}">
      <i style="background:${r.a1}"></i><i style="background:${r.a2}"></i>
      <i style="background:${r.bg2}"></i><i style="background:${r.text}"></i>
    </div>
    <dl class="meta">
      <dt>配色</dt><dd title="${r.pal}">${r.palCn}</dd>
      <dt>字体</dt><dd>${r.font}</dd>
      <dt>页宽</dt><dd>${r.pw}px</dd>
      <dt>圆角</dt><dd>${r.radius}px</dd>
    </dl>
    <div class="chips">${chips}</div>
    <a class="dl" href="themes/theme${r.n}.zip" download>下载 theme${r.n}.zip</a>
  </article>`;
}

function render(){
  document.getElementById('tabs').innerHTML = tabHtml();
  document.querySelectorAll('.tab').forEach(el=>{
    el.onclick = ()=>{ active = el.dataset.g; render(); };
  });
  const rows = DATA.filter(r=>r.g===active);
  const q = document.getElementById('q').value.trim();
  const shown = q ? rows.filter(r=>String(r.n).includes(q)) : rows;
  document.getElementById('groupName').textContent = active;
  const totalMb = rows.reduce((s,r)=>s+r.mb, 0).toFixed(1);
  document.getElementById('groupRange').textContent =
    rows.length ? `${rows[0].n} – ${rows[rows.length-1].n} · 共 ${rows.length} 个 · ${totalMb} MB` : '';
  document.getElementById('grid').innerHTML =
    shown.length ? shown.map(cardHtml).join('')
                 : '<div class="empty">没有匹配的编号</div>';
}

document.getElementById('q').addEventListener('input', render);
document.getElementById('copy').onclick = async ()=>{
  const rows = DATA.filter(r=>r.g===active);
  const base = location.href.replace(/[^/]*$/,'');
  const text = rows.map(r=>`theme${r.n}\t${base}themes/theme${r.n}.zip`).join('\n');
  try{
    await navigator.clipboard.writeText(text);
    const b = document.getElementById('copy');
    b.textContent = '已复制 ' + rows.length + ' 条'; 
    setTimeout(()=>b.textContent='复制本组链接', 1800);
  }catch(e){ alert('复制失败，请手动选择'); }
};
render();
</script>
